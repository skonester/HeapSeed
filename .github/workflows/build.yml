name: Cloud Build & Release
 
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
 
permissions:
  contents: read

concurrency:
  group: heapseed-release
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
 
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
 
      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rpm fakeroot dpkg libfuse2t64
 
      - name: Install Node Dependencies
        run: npm ci

      - name: Verify GPL FFmpeg and Prepare Corresponding Source
        run: npm run codecs:prepare

      - name: Build Renderer
        run: npm run build:renderer

      - name: Build Windows Packages
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --x64 --publish never

      - name: Build Linux Packages
        if: matrix.os == 'ubuntu-24.04'
        run: npx electron-builder --linux --x64 --publish never

      - name: Upload Packages
        uses: actions/upload-artifact@v7
        with:
          name: heapseed-${{ matrix.os }}
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download All Packages
        uses: actions/download-artifact@v8
        with:
          pattern: heapseed-*
          merge-multiple: true
          path: dist

      - name: Read Release Version
        id: version
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish One Regular Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "${TAG#v}" \
              --notes "Windows and Linux builds of HeapSeed ${TAG#v}."
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --prerelease=false --latest
